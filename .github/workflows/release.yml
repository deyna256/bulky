name: Release

on:
  workflow_dispatch:
    inputs:
      preview:
        description: Run release checks without publishing
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: bulky-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.prepare.outputs.sha }}
      published: ${{ steps.prepare.outputs.published }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release version and source
        id: prepare
        run: bash scripts/prepare-release.sh

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ needs.verify.outputs.sha }}

  publish:
    needs: [verify, ci]
    if: needs.verify.outputs.published == 'false' && !inputs.preview
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.59.0'
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: just publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    needs: [verify, ci, publish]
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.preview &&
          needs.verify.result == 'success' && needs.ci.result == 'success' &&
          (needs.publish.result == 'success' ||
           (needs.publish.result == 'skipped' && needs.verify.outputs.published == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA"
          else
            git push origin "$SHA:refs/tags/$TAG"
          fi
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == true ]]; then
              gh release edit "$TAG" --verify-tag --draft=false
            fi
          else
            flags=()
            if [[ "${TAG%%+*}" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --generate-notes "${flags[@]}"
          fi
