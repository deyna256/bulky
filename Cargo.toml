[package]
name = "bulky"
version = "0.2.0"
edition = "2024"
description = "A command wrapper for sharing a workload limit across projects on one machine"
repository = "https://github.com/deyna256/bulky"
license = "Apache-2.0"
readme = "README.md"
categories = ["command-line-utilities", "concurrency"]
include = ["src/**", "tests/**", "README.md", "SECURITY.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", features = ["signal", "user"] }
