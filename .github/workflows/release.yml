name: Release

on:
  workflow_dispatch:
    inputs:
      preview:
        description: Run release checks without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bulky-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  tag:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag the tested commit
        id: version
        env:
          PREVIEW: ${{ inputs.preview }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[0].version')
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ $(git rev-parse "$tag^{commit}") != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag belongs to a different commit. Bump the Cargo version on main."
              exit 1
            fi
          elif [[ "$PREVIEW" == false ]]; then
            git push origin "$GITHUB_SHA:refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    if: ${{ !inputs.preview }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check if this version reached crates.io
        id: registry
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          published=$(curl -fsS --retry 3 https://index.crates.io/bu/lk/bulky | jq -s --arg v "${TAG#v}" 'any(.[]; .vers == $v)')
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        if: steps.registry.outputs.published == 'false'
        with:
          just-version: '1.59.0'
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.registry.outputs.published == 'false'
        id: auth
      - run: just publish
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    needs: [tag, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null; then
            flags=()
            if [[ "${TAG%%+*}" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --generate-notes "${flags[@]}"
          fi
